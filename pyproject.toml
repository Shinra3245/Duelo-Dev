[tool.pytest.ini_options]
testpaths = ["judge/tests"]
addopts = "-ra --strict-markers"
markers = ["sandbox: requiere entorno desechable y runtime del juez validado"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.black]
target-version = ["py312"]
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
