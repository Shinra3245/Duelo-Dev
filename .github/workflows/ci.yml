# CI de DueloDev — obligatorio desde la Semana 0 (contexto H11).
#
# El CI compartido valida contratos puros y construcción de invocaciones. Las
# pruebas con código no confiable se ejecutan únicamente en la VM rootless
# desechable mediante los scripts judge-vm-*.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  preparacion:
    name: Detectar fases implementadas
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.fases.outputs.api }}
    steps:
      - uses: actions/checkout@v4
      - id: fases
        shell: bash
        run: |
          if [[ -f api/package.json ]]; then
            echo "api=true" >> "$GITHUB_OUTPUT"
          else
            echo "api=false" >> "$GITHUB_OUTPUT"
            echo "API e integración pendientes de implementación (F2)." >> "$GITHUB_STEP_SUMMARY"
          fi

  formato:
    name: Formato y lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  unitarios:
    name: Pruebas unitarias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm test

  # Se activa en la Semana 3, cuando existan migraciones y endpoints.
  integracion:
    name: Integración (API + Postgres + Redis)
    runs-on: ubuntu-latest
    needs: preparacion
    if: needs.preparacion.outputs.api == 'true'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: duelodev
          POSTGRES_PASSWORD: test
          POSTGRES_DB: duelodev_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U duelodev -d duelodev_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://duelodev:test@localhost:5432/duelodev_test
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test:integration --workspace api

  juez:
    name: Juez — contratos, pipeline y preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: judge/requirements-dev.txt
      - run: pip install -r judge/requirements-dev.txt
      - run: ruff check judge/
      - run: black --check judge/
      - run: mypy judge/
      - run: python -m pytest judge/tests -v
      - name: Validar scripts reproducibles de VM
        run: bash -n scripts/judge-vm-*.sh
      - name: Alcance de seguridad del runner compartido
        shell: bash
        run: |
          echo "El CI valida evaluación, compilación, sesiones, stream y fencing con fronteras inyectadas." >> "$GITHUB_STEP_SUMMARY"
          echo "No ejecuta soluciones no confiables: los smokes S01–S20 requieren la VM desechable con Docker rootless." >> "$GITHUB_STEP_SUMMARY"

  auditoria:
    name: Auditoría de dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Bloqueante: lo que realmente se despliega.
      - name: Dependencias de produccion
        run: npm audit --omit=dev --audit-level=moderate
      # Informativo: las de desarrollo (vitest/vite) no llegan al servidor y
      # Revisar cada advisory; no asumir que ninguna afecta al entorno de desarrollo.
      - name: Dependencias de desarrollo (informativo)
        continue-on-error: true
        run: npm audit --audit-level=high
